<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniHive - Login & Register</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="login-container">
        <div class="login-card">
            <div class="brand">
                <div class="brand-logo">🐝</div>
                <h1>UniHive</h1>
                <p class="brand-tagline">Real-Time Group Chat System</p>
            </div>

            <!-- Tabs -->
            <div class="auth-tabs">
                <button id="tabLogin" class="tab-btn active">Sign In</button>
                <button id="tabRegister" class="tab-btn">Create Account</button>
            </div>

            <!-- Error Banner -->
            <div id="authError" class="auth-error" style="display: none;"></div>

            <!-- Login Form -->
            <form id="loginForm">
                <div class="form-group">
                    <label for="loginIdentifier">Username or Email</label>
                    <input
                        type="text"
                        id="loginIdentifier"
                        placeholder="Enter username or email"
                        required
                        autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Enter password"
                        required
                        autocomplete="current-password">
                </div>

                <button type="submit" class="primary-btn" id="loginSubmitBtn">
                    Sign In
                </button>
            </form>

            <!-- Register Form -->
            <form id="registerForm" style="display: none;">
                <div class="form-group">
                    <label for="regUsername">Username</label>
                    <input
                        type="text"
                        id="regUsername"
                        placeholder="Choose a username (3-30 chars)"
                        required
                        autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="regEmail">Email Address</label>
                    <input
                        type="email"
                        id="regEmail"
                        placeholder="name@example.com"
                        required
                        autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="regPassword">Password</label>
                    <input
                        type="password"
                        id="regPassword"
                        placeholder="At least 6 characters"
                        required
                        autocomplete="new-password">
                </div>

                <button type="submit" class="primary-btn" id="registerSubmitBtn">
                    Create Account
                </button>
            </form>
        </div>
    </div>

    <script src="config.js"></script>
    <script src="login.js"></script>
</body>
</html>

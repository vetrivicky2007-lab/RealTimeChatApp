services:
  - type: web
    name: unihive
    runtime: java
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/unihive-1.0.0.jar
    envVars:
      - key: SPRING_DATA_MONGODB_URI
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: "*"
      - key: CLOUDINARY_URL
        sync: false

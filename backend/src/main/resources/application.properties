# =============================================================
# UniHive Spring Boot Configuration
# =============================================================
spring.application.name=UniHive

# Port configuration (Uses Render's $PORT if defined, defaults to 8080)
server.port=${PORT:8080}

# MongoDB Atlas / Cloud connection
# Never hardcode credentials here; all secrets come from environment variables.
# Format: mongodb+srv://<username>:<password>@<cluster-address>/unihive?retryWrites=true&w=majority
spring.data.mongodb.uri=${MONGODB_URI:${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/unihive}}
spring.data.mongodb.database=unihive

# JWT Configuration
app.jwt.secret=${JWT_SECRET:unihive_dev_secret_key_which_is_at_least_32_bytes_long_safe_for_hs256}
# 24 hours in milliseconds (86400000)
app.jwt.expiration-ms=86400000

# CORS Allowed Origins (Comma-separated list or single URL)
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:3000,http://localhost:8080,http://127.0.0.1:5500,http://127.0.0.1:3000,http://localhost:5500}

# Logging configuration
logging.level.root=INFO
logging.level.chat=INFO
logging.level.org.springframework.data.mongodb=WARN
logging.level.org.mongodb.driver=WARN
